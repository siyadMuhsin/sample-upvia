version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: upvia-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: upvia
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: upvia-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: upvia-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: upvia-backend
    restart: always
    depends_on:
      - mongodb
      - redis
      - minio
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/upvia
      JWT_SECRET: upvia_super_secret_jwt_access_key_2026_enterprise_production
      JWT_REFRESH_SECRET: upvia_super_secret_jwt_refresh_key_2026_enterprise_production
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: upvia-documents
      FRONTEND_URL: http://localhost:3000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: upvia-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

volumes:
  mongodb_data:
  redis_data:
  minio_data:
